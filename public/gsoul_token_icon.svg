<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 赛博朋克霓虹金与暗夜紫渐变背景 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0518" />
      <stop offset="50%" stop-color="#180b2e" />
      <stop offset="100%" stop-color="#05020a" />
    </linearGradient>
    
    <!-- 核心圆环霓虹渐变 (亮青色到赛博紫) -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#7f00ff" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <!-- 太阳/源点放射渐变 -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#7f00ff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#05020a" stop-opacity="0" />
    </radialGradient>

    <!-- 盾牌认证金边渐变 -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700" />
      <stop offset="50%" stop-color="#ffaa00" />
      <stop offset="100%" stop-color="#ff8800" />
    </linearGradient>

    <!-- 发光滤镜 -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 背景画布 -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />

  <!-- 背景科技光晕 -->
  <circle cx="256" cy="256" r="180" fill="url(#coreGlow)" />

  <!-- 外发光环与网格轨道 -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#ringGrad)" stroke-width="4" stroke-dasharray="12 8" opacity="0.6" />
  <circle cx="256" cy="256" r="170" fill="none" stroke="#00f2fe" stroke-width="2" opacity="0.4" filter="url(#neonGlow)" />

  <!-- 内部几何多维网格 (代表 AI 智能体去中心化矩阵) -->
  <g opacity="0.25" stroke="#00f2fe" stroke-width="1.5" fill="none">
    <polygon points="256,76 412,166 412,346 256,436 100,346 100,166" />
    <line x1="256" y1="76" x2="256" y2="436" />
    <line x1="100" y1="166" x2="412" y2="346" />
    <line x1="100" y1="346" x2="412" y2="166" />
  </g>

  <!-- 核心数字灵魂与 0x 符号 -->
  <g transform="translate(0, -5)" filter="url(#neonGlow)">
    <!-- 字母 0 与 X 的融合设计 -->
    <text x="256" y="275" font-family="'Courier New', monospace, sans-serif" font-weight="900" font-size="115" fill="#ffffff" text-anchor="middle" letter-spacing="4">0x</text>
    <text x="256" y="325" font-family="'Courier New', monospace, sans-serif" font-weight="700" font-size="42" fill="#00f2fe" text-anchor="middle" letter-spacing="8">.SOUL</text>
  </g>

  <!-- 右下角官方安全认证盾牌 (防第三方误判、去中心化双链认证) -->
  <g transform="translate(355, 355)" filter="url(#neonGlow)">
    <!-- 盾牌底色 -->
    <path d="M 0,-15 L 35,-30 L 70,-15 C 70,30 35,65 35,65 C 35,65 0,30 0,-15 Z" fill="#0a0518" stroke="url(#goldGrad)" stroke-width="6" />
    <!-- 认证对勾 (Checkmark) -->
    <polyline points="20,15 30,28 50,2" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- 顶部边缘去中心化安全恒星/节点装饰 -->
  <circle cx="256" cy="55" r="5" fill="#00f2fe" filter="url(#neonGlow)" />
  <circle cx="120" cy="120" r="3" fill="#7f00ff" />
  <circle cx="392" cy="120" r="3" fill="#7f00ff" />

</svg>
